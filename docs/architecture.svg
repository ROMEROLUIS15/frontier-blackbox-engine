<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>

  <!-- Client -->
  <rect x="8" y="128" width="120" height="74" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="68" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Evaluador /</text>
  <text x="68" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">cliente</text>

  <!-- Railway boundary -->
  <rect x="190" y="10" width="698" height="310" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="202" y="30" font-size="12.5" font-weight="600" fill="#6d28d9">Servicio en Railway · build con Railpack · exactamente 1 réplica · env TEAM_TOKEN, PORT</text>

  <!-- Node process -->
  <rect x="204" y="42" width="670" height="266" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="216" y="61" font-size="12" fill="#475569">Un único proceso Node.js 24 · TypeScript ejecutado de forma nativa · cero dependencias de runtime</text>

  <!-- http -->
  <rect x="220" y="128" width="160" height="74" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="300" y="153" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e3a8a">http/server.ts</text>
  <text x="300" y="171" text-anchor="middle" font-size="11.5" fill="#1e3a8a">auth Bearer · rutas</text>
  <text x="300" y="187" text-anchor="middle" font-size="10.5" fill="#1e3a8a">/health /__reset /msg · X-Req</text>

  <!-- parse -->
  <rect x="440" y="78" width="190" height="64" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="535" y="102" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">protocol/parse.ts</text>
  <text x="535" y="121" text-anchor="middle" font-size="11.5" fill="#14532d">E201 → E202 → E301 → E302</text>

  <!-- control -->
  <rect x="680" y="78" width="180" height="64" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="770" y="102" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">control/iso7064.ts</text>
  <text x="770" y="121" text-anchor="middle" font-size="11.5" fill="#14532d">auxiliar · ISO 7064 MOD 97-10</text>

  <!-- commands -->
  <rect x="440" y="190" width="190" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="535" y="214" text-anchor="middle" font-size="13.5" font-weight="600" fill="#78350f">bank/commands.ts</text>
  <text x="535" y="233" text-anchor="middle" font-size="11.5" fill="#78350f">6 comandos (puro)</text>

  <!-- state -->
  <rect x="680" y="190" width="180" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="770" y="214" text-anchor="middle" font-size="13.5" font-weight="600" fill="#78350f">bank/state.ts</text>
  <text x="770" y="233" text-anchor="middle" font-size="11.5" fill="#78350f">en memoria: cuentas, ops</text>

  <!-- errors -->
  <rect x="440" y="268" width="420" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="650" y="288" text-anchor="middle" font-size="12" fill="#7f1d1d">auxiliar · protocol/errors.ts · catálogo de errores (parse + commands)</text>

  <!-- arrows -->
  <line x1="128" y1="155" x2="218" y2="155" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="160" y="147" text-anchor="middle" font-size="11" fill="#334155">1 HTTPS</text>
  <line x1="218" y1="178" x2="130" y2="178" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="160" y="194" text-anchor="middle" font-size="11" fill="#334155">6 status</text><text x="160" y="207" text-anchor="middle" font-size="11" fill="#334155">+ JSON</text>

  <line x1="380" y1="145" x2="438" y2="115" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="372" y="118" font-size="11" fill="#334155">2 validar</text>
  <line x1="630" y1="110" x2="678" y2="110" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="654" y="102" text-anchor="middle" font-size="11" fill="#334155">3 usa</text>
  <line x1="535" y1="142" x2="535" y2="188" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="543" y="170" font-size="11" fill="#334155">4 ejecutar (si es válido)</text>
  <line x1="630" y1="222" x2="678" y2="222" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="654" y="214" text-anchor="middle" font-size="11" fill="#334155">5 l/e</text>
  <line x1="535" y1="254" x2="535" y2="266" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <path d="M440,128 C420,150 420,250 438,282" fill="none" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#a)"/>
</svg>
