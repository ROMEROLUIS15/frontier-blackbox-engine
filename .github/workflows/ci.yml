name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/console]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verify:
    name: backend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  console-verify:
    name: console-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require console package
        run: |
          if [ ! -f console/package.json ]; then
            echo "console/package.json is missing: this required check must not be skipped" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npm run verify
        working-directory: console

  harness-guardrails:
    name: harness-guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check release guardrails (pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/check-workspace.ts --workspace release --base origin/${{ github.base_ref || 'main' }}
      - name: Check release guardrails (push to main)
        if: github.event_name == 'push'
        run: node scripts/check-workspace.ts --workspace release --base HEAD~1
